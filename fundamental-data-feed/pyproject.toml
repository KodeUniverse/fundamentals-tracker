[project]
name = "fundamental-data-feed"
version = "0.1.0"
description = "Ingestion service for fundamentals tracker"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "edgartools>=5.62.1",
    "psycopg[binary]>=3.2.0",
    "sqlalchemy>=2.0.0",
    "httpx>=0.27.0",
    "pandas>=2.2.0",
    "yfinance>=0.2.40",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["."]
